name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        working-directory: khatapilot
    env:
      APP_ENV: test
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: khatapilot/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit, architecture, scenario and red-team tests (mock LLM, no network)
        run: python -m pytest --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: khatapilot/test-results.xml
      - name: Red-team report (block rate, false-alarm rate, per category)
        if: matrix.os == 'ubuntu-latest'
        run: python redteam/runner.py --risk-model rules --out redteam-report
      - name: Upload red-team report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: khatapilot/redteam-report/

  frontend:
    name: frontend (type check and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: khatapilot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: khatapilot/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
