# Optional: `python scripts/make_env.py` first (creates .env), then `docker compose up --build`.
# The PowerShell path (scripts\dev.ps1) is the primary way to run KhataPilot; this is a convenience.
services:
  sandbox:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: python -m uvicorn sandbox.app:create_app --factory --host 0.0.0.0 --port 8100
    env_file: .env
    ports:
      - "8100:8100"
    volumes:
      - sandbox-var:/app/sandbox/var

  backend:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: python -m uvicorn app.main:create_app --factory --app-dir backend --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      SANDBOX_URL: http://sandbox:8100
      SCHEDULER_IN_WEB: "false"  # the worker below runs the jobs
    ports:
      - "8000:8000"
    depends_on:
      - sandbox
    volumes:
      - backend-var:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Scheduled payments, the daily checks, alert SMS and backups, in their own process (scripts/worker.py).
  worker:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: python scripts/worker.py
    env_file: .env
    environment:
      SANDBOX_URL: http://sandbox:8100
    depends_on:
      - backend
    volumes:
      - backend-var:/app/var
    restart: unless-stopped

  # Texts the owner when the backend or the provider stops answering (scripts/uptime_check.py).
  uptime:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: python scripts/uptime_check.py --backend http://backend:8000/api/health --sandbox http://sandbox:8100/health
    env_file: .env
    volumes:
      - backend-var:/app/var
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    # Built and served compressed (fast on a phone); use `npm run dev` here instead for UI work with instant reload.
    command: sh -c "npm ci && npm run serve -- --host 0.0.0.0"
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend-modules:/app/frontend/node_modules
    depends_on:
      - backend

volumes:
  sandbox-var:
  backend-var:
  frontend-modules:
